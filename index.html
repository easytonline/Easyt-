<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>easy t.online</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:
        radial-gradient(circle at 5% 15%,rgba(255,50,50,.20),transparent 22%),
        radial-gradient(circle at 95% 40%,rgba(255,50,50,.16),transparent 25%),
        radial-gradient(circle at 10% 90%,rgba(255,50,50,.15),transparent 23%),
        #fff;
    color:#222;
    min-height:100vh;
}

.page{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:22px 16px 35px;
}

/* LOGO */

.logo{
    text-align:center;
    margin:5px 0 20px;
}

.logo h1{
    margin:0;
    font-size:48px;
    font-weight:900;
    letter-spacing:-2px;
    color:#222;
}

.logo h1 span{
    color:#d40000;
}

.logo-line{
    width:190px;
    height:6px;
    background:#d40000;
    border-radius:50%;
    margin:3px auto 0;
    transform:rotate(-3deg);
}

/* MAIN CARD */

.card{
    position:relative;
    overflow:hidden;
    background:rgba(255,255,255,.94);
    border:2px solid #e00000;
    border-radius:30px;
    padding:28px 20px 24px;
    box-shadow:
        0 15px 45px rgba(190,0,0,.13),
        inset 0 0 30px rgba(255,0,0,.025);
}

/* TOP ICON */

.icon{
    width:70px;
    height:70px;
    margin:0 auto 18px;
    border-radius:50%;
    background:linear-gradient(145deg,#ff3030,#c90000);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    box-shadow:0 8px 22px rgba(210,0,0,.25);
}

/* TITLE */

.title{
    text-align:center;
    color:#c90000;
    font-size:28px;
    font-weight:900;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    font-size:17px;
    color:#333;
    margin-bottom:22px;
}

/* AMOUNT */

.amount-box{
    background:linear-gradient(
        135deg,
        #fff1f1,
        #ffe4e4
    );
    border:1px solid #ffcaca;
    border-radius:25px;
    padding:20px 12px;
    text-align:center;
    margin-bottom:24px;
    box-shadow:0 8px 22px rgba(200,0,0,.08);
}

.amount-title{
    font-size:18px;
    margin-bottom:6px;
}

.amount{
    font-size:48px;
    font-weight:900;
    color:#c90000;
}

/* LABEL */

.field-label{
    display:block;
    text-align:right;
    font-size:18px;
    font-weight:800;
    margin:0 5px 9px;
}

/* INPUT */

.receive-number{
    width:100%;
    height:58px;
    border:1px solid #ddd;
    border-radius:18px;
    background:#fff;
    padding:0 18px;
    font-size:17px;
    outline:none;
    box-shadow:
        0 4px 15px rgba(0,0,0,.05),
        inset 0 1px 3px rgba(0,0,0,.03);
    margin-bottom:18px;
}

.receive-number:focus{
    border-color:#e00000;
    box-shadow:0 0 0 3px rgba(224,0,0,.08);
}

/* UPLOAD */

.upload-box{
    border:2px dashed #ccc;
    border-radius:22px;
    padding:22px 15px;
    text-align:center;
    background:#fff;
    margin-bottom:14px;
    transition:.2s;
}

.upload-box:hover{
    border-color:#e00000;
}

.upload-icon{
    font-size:42px;
    color:#d00000;
    margin-bottom:8px;
}

.upload-title{
    font-size:19px;
    font-weight:bold;
}

.upload-sub{
    color:#999;
    font-size:14px;
    margin-top:5px;
}

.file-input{
    width:100%;
    margin-top:14px;
    font-size:14px;
}

/* PREVIEW */

.preview-box{
    display:none;
    background:#fafafa;
    border:1px solid #eee;
    border-radius:20px;
    padding:10px;
    margin-bottom:16px;
}

.preview-box img{
    display:block;
    width:100%;
    max-height:250px;
    object-fit:contain;
    border-radius:14px;
}

/* NOTE */

.note{
    text-align:center;
    font-size:17px;
    font-weight:bold;
    margin:15px 0 5px;
}

.arrow{
    text-align:center;
    color:#d00000;
    font-size:43px;
    line-height:45px;
    animation:bounce 1.2s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(8px);
    }
}

/* RED BUTTON */

.pay-btn{
    width:100%;
    height:62px;
    border:0;
    border-radius:20px;
    background:linear-gradient(
        135deg,
        #ff2525,
        #c90000
    );
    color:#fff;
    font-size:21px;
    font-weight:900;
    cursor:pointer;
    box-shadow:
        0 9px 24px rgba(200,0,0,.25);
    transition:.2s;
}

.pay-btn:active{
    transform:scale(.98);
}

/* BLACK BUTTON */

.withdraw-btn{
    width:100%;
    height:62px;
    margin-top:20px;
    border:0;
    border-radius:20px;
    background:linear-gradient(
        135deg,
        #333,
        #111
    );
    color:#fff;
    font-size:21px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 9px 24px rgba(0,0,0,.18);
}

/* DEMO */

.demo{
    text-align:center;
    color:#c90000;
    background:#fff0f0;
    border-radius:15px;
    padding:9px;
    margin-top:18px;
    font-size:13px;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:400px){

    .logo h1{
        font-size:40px;
    }

    .title{
        font-size:24px;
    }

    .amount{
        font-size:42px;
    }

}

</style>
</head>

<body>

<div class="page">

    <!-- LOGO -->

    <div class="logo">

        <h1>
            easy <span>t</span>.online
        </h1>

        <div class="logo-line"></div>

    </div>


    <!-- MAIN CARD -->

    <div class="card">

        <div class="icon">
            💳
        </div>


        <div class="title">
            فاضل بس خطوة التجربة
        </div>


        <div class="subtitle">
            دي آخر مرحلة للاستلام التجريبي
        </div>


        <!-- AMOUNT -->

        <div class="amount-box">

            <div class="amount-title">
                المبلغ التجريبي:
            </div>

            <div class="amount">
                1420 ج
            </div>

        </div>


        <!-- RECEIVE NUMBER -->

        <label class="field-label">
            👤 رقم الاستلام
        </label>

        <input
            id="receiveNumber"
            class="receive-number"
            type="tel"
            inputmode="numeric"
            placeholder="اكتب رقم الاستلام"
        >


        <!-- UPLOAD -->

        <div class="upload-box">

            <div class="upload-icon">
                ☁️
            </div>

            <div class="upload-title">
                إرفاق صورة تجريبية
            </div>

            <div class="upload-sub">
                اختر صورة من المعرض
            </div>

            <input
                id="fileInput"
                class="file-input"
                type="file"
                accept="image/*"
            >

        </div>


        <!-- PREVIEW -->

        <div
            id="previewBox"
            class="preview-box"
        >

            <img id="preview">

        </div>


        <div class="note">
            يرجى إكمال الخطوة التجريبية وإرفاق الاسكرين هنا
        </div>


        <div class="arrow">
            ⬇️
        </div>


        <!-- BUTTON -->

        <button
            class="pay-btn"
            onclick="demoPayment()"
        >
            💳 دفع الضريبة التجريبية
        </button>

    </div>


    <!-- WITHDRAW -->

    <button
        class="withdraw-btn"
        onclick="demoWithdraw()"
    >
        🪙 سحب المكسب
    </button>


    <div class="demo">
        DEMO • هذه الصفحة للتجربة والعرض فقط
    </div>

</div>


<script>

const fileInput =
document.getElementById("fileInput");

const previewBox =
document.getElementById("previewBox");

const preview =
document.getElementById("preview");


fileInput.addEventListener(
    "change",
    function(){

        const file = this.files[0];

        if(!file){
            return;
        }

        const reader =
        new FileReader();

        reader.onload =
        function(e){

            preview.src =
            e.target.result;

            previewBox.style.display =
            "block";

        };

        reader.readAsDataURL(file);

    }
);


function demoPayment(){

    const number =
    document.getElementById(
        "receiveNumber"
    ).value.trim();

    if(number === ""){

        alert(
            "يرجى كتابة رقم الاستلام أولاً."
        );

        return;
    }

    alert(
        "يرجى إكمال الخطوة التجريبية أولاً للمتابعة."
    );

}


function demoWithdraw(){

    alert(
        "هذه واجهة Demo ولا توجد عملية سحب أو تحويل أموال حقيقية."
    );

}

</script>

</body>
</html>
