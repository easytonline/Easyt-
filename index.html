<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>easy t.online</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:
    radial-gradient(circle at -5% 8%,rgba(255,0,0,.28),transparent 23%),
    radial-gradient(circle at 105% 42%,rgba(255,0,0,.22),transparent 25%),
    radial-gradient(circle at 100% 92%,rgba(255,0,0,.20),transparent 22%),
    #fff;
  color:#111;
  padding:20px 14px 30px;
  overflow-x:hidden;
}

.page{
  width:100%;
  max-width:760px;
  margin:auto;
}

/* LOGO */
.logo{
  text-align:center;
  margin:5px auto 24px;
  position:relative;
}

.logo-text{
  display:inline-block;
  font-size:clamp(45px,10vw,78px);
  line-height:1;
  font-weight:900;
  font-style:italic;
  letter-spacing:-5px;
  text-shadow:3px 4px 4px rgba(0,0,0,.18);
}

.logo-red{
  color:#d90000;
}

.logo-black{
  color:#171717;
}

.logo-swoosh{
  width:52%;
  max-width:390px;
  height:10px;
  background:#d90000;
  border-radius:100%;
  margin:5px auto 0;
  transform:rotate(-5deg);
  box-shadow:0 4px 4px rgba(180,0,0,.15);
}

/* MAIN CARD */
.card{
  background:rgba(255,255,255,.96);
  border:2px solid #e00000;
  border-radius:38px;
  padding:28px 38px 25px;
  box-shadow:
    0 12px 35px rgba(0,0,0,.10),
    0 0 35px rgba(255,0,0,.08);
}

/* TOP ICON */
.icon-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:20px;
}

.line{
  height:5px;
  width:115px;
  border-radius:20px;
  background:linear-gradient(
    90deg,
    transparent,
    #ffd4d4
  );
}

.line.right{
  transform:scaleX(-1);
}

.icon{
  width:75px;
  height:75px;
  flex:none;
  border-radius:50%;
  background:linear-gradient(145deg,#ff3333,#c80000);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:37px;
  font-weight:bold;
  box-shadow:
    0 8px 22px rgba(200,0,0,.25),
    0 0 0 12px rgba(255,70,70,.08);
}

/* TITLES */
.main-title{
  text-align:center;
  color:#cf0000;
  font-size:clamp(27px,5vw,42px);
  font-weight:900;
  margin:0;
  line-height:1.3;
}

.sub-title{
  text-align:center;
  font-size:clamp(20px,4vw,29px);
  margin:8px 0 26px;
}

/* AMOUNT */
.amount-box{
  background:linear-gradient(
    135deg,
    #fff5f5,
    #ffe1e1
  );
  border:2px solid #ffbaba;
  border-radius:28px;
  padding:17px 20px 20px;
  text-align:center;
  box-shadow:
    inset 0 2px 10px rgba(255,0,0,.05);
}

.amount-label{
  font-size:23px;
  font-weight:bold;
}

.amount{
  direction:ltr;
  font-size:clamp(48px,9vw,76px);
  font-weight:900;
  color:#d00000;
  line-height:1;
  margin-top:7px;
}

/* RECEIPT */
.field-title{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:23px;
  font-weight:900;
  margin:25px 5px 10px;
}

.person-icon{
  width:32px;
  height:32px;
  position:relative;
}

.person-icon:before{
  content:"";
  position:absolute;
  width:12px;
  height:12px;
  border:3px solid #111;
  border-radius:50%;
  left:7px;
  top:0;
}

.person-icon:after{
  content:"";
  position:absolute;
  width:24px;
  height:12px;
  border:3px solid #111;
  border-radius:15px 15px 0 0;
  border-bottom:0;
  left:1px;
  bottom:2px;
}

input[type="text"]{
  width:100%;
  height:68px;
  border:2px solid #ddd;
  border-radius:20px;
  background:#fff;
  box-shadow:
    inset 0 3px 8px rgba(0,0,0,.06);
  outline:none;
  padding:0 22px;
  font-size:21px;
  font-family:inherit;
}

input[type="text"]:focus{
  border-color:#e00000;
  box-shadow:
    0 0 0 4px rgba(220,0,0,.07),
    inset 0 3px 8px rgba(0,0,0,.04);
}

input::placeholder{
  color:#aaa;
}

/* UPLOAD */
.upload{
  margin-top:20px;
  min-height:155px;
  border:2px dashed #bbb;
  border-radius:23px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:25px;
  cursor:pointer;
  transition:.2s;
}

.upload:hover{
  border-color:#d90000;
  background:#fffafa;
}

.upload-icon{
  font-size:50px;
  color:#d00000;
}

.upload-text{
  text-align:center;
}

.upload-title{
  font-size:23px;
  font-weight:bold;
}

.upload-sub{
  color:#999;
  font-size:18px;
  margin-top:5px;
}

.image-icon{
  width:75px;
  height:75px;
  border-radius:18px;
  background:#f8f8f8;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

#fileInput{
  display:none;
}

/* PREVIEW */
.preview{
  display:none;
  margin-top:16px;
  height:145px;
  border-radius:22px;
  background:#fafafa;
  border:1px solid #e5e5e5;
  overflow:hidden;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.04);
}

.preview img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* NOTE */
.note{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin:19px 0 4px;
}

.arrow{
  text-align:center;
  color:#e00000;
  font-size:43px;
  line-height:30px;
  font-weight:bold;
}

/* BUTTONS */
.btn{
  width:100%;
  height:70px;
  border:0;
  border-radius:22px;
  font-family:inherit;
  font-size:26px;
  font-weight:900;
  cursor:pointer;
  transition:.15s;
}

.btn:active{
  transform:scale(.985);
}

.btn-red{
  background:linear-gradient(
    135deg,
    #ff2525,
    #cf0000
  );
  color:#fff;
  box-shadow:
    0 9px 20px rgba(205,0,0,.22);
}

.btn-black{
  margin-top:20px;
  background:linear-gradient(
    135deg,
    #333,
    #111
  );
  color:#fff;
  box-shadow:
    0 9px 20px rgba(0,0,0,.18);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.modal-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:27px;
  padding:30px 25px 25px;
  text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.35);
  animation:popup .18s ease-out;
}

@keyframes popup{
  from{
    transform:scale(.85);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.modal-icon{
  width:68px;
  height:68px;
  border-radius:50%;
  margin:auto;
  background:#fff0f0;
  color:#d00000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:900;
}

.modal-box h2{
  color:#c90000;
  font-size:27px;
  margin:15px 0 8px;
}

.modal-box p{
  font-size:19px;
  line-height:1.7;
  margin:0 0 20px;
}

.close{
  width:100%;
  height:55px;
  border:0;
  border-radius:17px;
  background:#171717;
  color:#fff;
  font-family:inherit;
  font-size:19px;
  font-weight:bold;
}

@media(max-width:520px){

  body{
    padding:15px 10px 25px;
  }

  .card{
    padding:22px 14px 20px;
    border-radius:30px;
  }

  .line{
    width:70px;
  }

  .icon{
    width:68px;
    height:68px;
  }

  .upload{
    gap:12px;
    padding:15px;
  }

  .upload-title{
    font-size:18px;
  }

  .upload-sub{
    font-size:15px;
  }

  .image-icon{
    width:62px;
    height:62px;
  }

  .btn{
    height:65px;
    font-size:23px;
  }
}
</style>
</head>

<body>

<div class="page">

  <!-- LOGO -->
  <div class="logo">
    <div class="logo-text">
      <span class="logo-red">easy t</span><span class="logo-black">.online</span>
    </div>
    <div class="logo-swoosh"></div>
  </div>


  <!-- MAIN CARD -->
  <div class="card">

    <div class="icon-row">
      <div class="line"></div>

      <div class="icon">▣</div>

      <div class="line right"></div>
    </div>


    <h1 class="main-title">
      فاضل بس خطوة
    </h1>

    <div class="sub-title">
      دي آخر مرحلة للاستلام
    </div>


    <!-- AMOUNT -->
    <div class="amount-box">

      <div class="amount-label">
        المبلغ المطلوب:
      </div>

      <div class="amount">
        1420 ج
      </div>

    </div>


    <!-- RECEIPT NUMBER -->
    <div class="field-title">

      <div class="person-icon"></div>

      <span>رقم الاستلام</span>

    </div>

    <input
      type="text"
      id="receiveNumber"
      placeholder="اكتب رقم الاستلام"
    >


    <!-- UPLOAD -->
    <div
      class="upload"
      onclick="document.getElementById('fileInput').click()"
    >

      <div class="upload-icon">
        ☁
      </div>

      <div class="upload-text">

        <div class="upload-title">
          إرفاق صورة الإثبات
        </div>

        <div class="upload-sub">
          اختر صورة من المعرض
        </div>

      </div>

      <div class="image-icon">
        🖼️
      </div>

    </div>

    <input
      type="file"
      id="fileInput"
      accept="image/*"
    >


    <!-- PREVIEW -->
    <div
      class="preview"
      id="previewBox"
    >
      <img
        id="preview"
        alt="preview"
      >
    </div>


    <div class="note">
      يرجى استكمال البيانات وإرفاق الصورة هنا
    </div>

    <div class="arrow">
      ⌄
    </div>


    <!-- RED BUTTON -->
    <button
      class="btn btn-red"
      onclick="continueButton()"
    >
      💳 متابعة
    </button>

  </div>


  <!-- BLACK BUTTON -->
  <button
    class="btn btn-black"
    onclick="withdrawButton()"
  >
    🪙 سحب المكسب
  </button>

</div>


<!-- MODAL -->
<div
  class="modal"
  id="modal"
  onclick="outsideClose(event)"
>

  <div class="modal-box">

    <div class="modal-icon">
      !
    </div>

    <h2>
      لا يمكن المتابعة
    </h2>

    <p id="modalText">
      يرجى استكمال البيانات وإرفاق الصورة أولًا.
    </p>

    <button
      class="close"
      onclick="closeModal()"
    >
      حسناً
    </button>

  </div>

</div>


<script>

/* IMAGE PREVIEW */

const fileInput =
  document.getElementById("fileInput");

const previewBox =
  document.getElementById("previewBox");

const preview =
  document.getElementById("preview");


fileInput.addEventListener(
  "change",
  function(){

    const file = this.files[0];

    if(!file){
      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function(e){

        preview.src =
          e.target.result;

        previewBox.style.display =
          "block";

      };

    reader.readAsDataURL(file);

  }
);


/* MODAL */

function showModal(message){

  document.getElementById(
    "modalText"
  ).innerText = message;

  document.getElementById(
    "modal"
  ).style.display = "flex";

}


function closeModal(){

  document.getElementById(
    "modal"
  ).style.display = "none";

}


function outsideClose(event){

  if(event.target.id === "modal"){
    closeModal();
  }

}


/* RED BUTTON */

function continueButton(){

  const number =
    document.getElementById(
      "receiveNumber"
    ).value.trim();

  const file =
    document.getElementById(
      "fileInput"
    ).files.length;


  if(!number){

    showModal(
      "يرجى كتابة رقم الاستلام أولاً."
    );

    return;
  }


  if(!file){

    showModal(
      "يرجى إرفاق صورة الإثبات أولاً."
    );

    return;
  }


  showModal(
    "تم استكمال البيانات بنجاح."
  );

}


/* WITHDRAW BUTTON */

function withdrawButton(){

  const number =
    document.getElementById(
      "receiveNumber"
    ).value.trim();

  const file =
    document.getElementById(
      "fileInput"
    ).files.length;


  if(!number || !file){

    showModal(
      "لا يمكن المتابعة. يرجى استكمال البيانات وإرفاق الصورة أولًا."
    );

    return;
  }


  showModal(
    "تم استكمال بيانات الواجهة. لا يتم تنفيذ تحويل أموال حقيقي من هذه الصفحة."
  );

}

</script>

</body>
</html>
