<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>easy t.online</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#ffffff;
    color:#222;
    text-align:center;
    padding:20px;
    position:relative;
    overflow:hidden;
}

/* كرات حمراء ضبابية */

.circle{
    position:absolute;
    width:220px;
    height:220px;
    background:rgba(255,0,0,0.25);
    border-radius:50%;
    filter:blur(35px);
    animation:float 6s infinite ease-in-out;
}

.c1{
    top:10%;
    left:15%;
}

.c2{
    top:50%;
    left:70%;
    animation-delay:1.5s;
}

.c3{
    top:75%;
    left:20%;
    animation-delay:3s;
}

@keyframes float{
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-25px);
    }
    100%{
        transform:translateY(0);
    }
}

/* كلمة easy t.online كبيرة ومتحركة */

h1{
    font-size:60px;
    font-weight:900;
    margin-top:10px;
    letter-spacing:4px;
    color:#d40000;
    animation:move 3s infinite ease-in-out;
}

@keyframes move{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
    100%{
        transform:scale(1);
    }
}

.box{
    background:rgba(255,255,255,0.90);
    padding:20px;
    border-radius:14px;
    max-width:420px;
    margin:20px auto;
    box-shadow:0 0 25px rgba(0,0,0,0.15);
    border:1px solid rgba(200,0,0,0.15);
    backdrop-filter:blur(4px);
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    margin-top:12px;
    font-size:18px;
    cursor:pointer;
}

.btn-pay{
    background:#e00000;
    color:white;
}

.btn-withdraw{
    background:#222;
    color:white;
}

input[type=file]{
    width:100%;
    margin-top:10px;
    padding:10px;
    background:white;
    border-radius:10px;
    box-sizing:border-box;
    border:1px solid #ddd;
}

input[type=text]{
    width:100%;
    margin-top:10px;
    padding:12px;
    background:white;
    border-radius:10px;
    box-sizing:border-box;
    border:1px solid #ddd;
    font-size:16px;
    text-align:center;
}

img{
    max-width:100%;
    margin-top:10px;
    border-radius:8px;
}

.arrow{
    font-size:40px;
    margin-top:5px;
    animation:bounce 1.2s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

</style>

</head>

<body>

<!-- كرات ضبابية -->

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>


<h1>easy t.online</h1>


<div class="box">

<h3>
فاضل بس ضريبة القيمة المضافة
</h3>

<p>
دي آخر مرحلة للاستلام الفوري
</p>

<h2>
الضريبة المطلوبة:
<strong>1420 ج</strong>
</h2>


<!-- رقم الاستلام -->

<label
style="
display:block;
margin-top:15px;
font-size:17px;
font-weight:bold;
">

رقم الاستلام

</label>

<input
type="text"
id="receiveNumber"
placeholder="اكتب رقم الاستلام"
>


<input
type="file"
id="fileInput"
>

<img
id="preview"
style="display:none"
>


<p
style="
margin-top:10px;
font-size:17px;
">

يرجى دفع الضريبة وإرفاق الاسكرين هنا

</p>


<div class="arrow">
⬇️
</div>


<button
class="btn-pay"
onclick="demoPay()"
>

دفع الضريبة

</button>

</div>


<button
class="btn-withdraw"
onclick="demoWithdraw()"
>

سحب المكسب

</button>


<script>

// عرض الصورة المرفوعة

const fileInput =
document.getElementById("fileInput");

const preview =
document.getElementById("preview");

fileInput.addEventListener(
"change",
function(){

    const file = this.files[0];

    if(file){

        const reader =
        new FileReader();

        reader.onload =
        function(e){

            preview.src =
            e.target.result;

            preview.style.display =
            "block";

        };

        reader.readAsDataURL(file);
    }

});


// زر دفع تجريبي

function demoPay(){

    alert(
        "   يرجي سداد الضريبه اولا ليتم تحويل الارباح لحضرتك."
    );

}


// زر سحب تجريبي

function demoWithdraw(){

    alert(
        "  يرجي سداد الضريبه اولا ليتم تحويل الارباح"
    );

}

</script>

</body>
</html>
