<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>easy t.online</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:
    radial-gradient(circle at 0% 15%,rgba(255,0,0,.20),transparent 25%),
    radial-gradient(circle at 100% 45%,rgba(255,0,0,.16),transparent 28%),
    #fff;
  color:#171717;
  min-height:100vh;
  padding:25px 15px 35px;
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
}

.logo{
  text-align:center;
  margin:5px 0 25px;
}

.logo-text{
  font-size:55px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-4px;
}

.logo-text .red{
  color:#d90000;
}

.logo-text .black{
  color:#202020;
}

.logo-line{
  width:180px;
  height:7px;
  background:#d90000;
  border-radius:100%;
  margin:5px auto 0;
  transform:rotate(-4deg);
}

.card{
  background:rgba(255,255,255,.96);
  border:2px solid #e00000;
  border-radius:30px;
  padding:30px 25px;
  box-shadow:0 15px 45px rgba(0,0,0,.12);
}

.icon{
  width:70px;
  height:70px;
  border-radius:50%;
  background:linear-gradient(145deg,#ff3333,#c90000);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  margin:0 auto 20px;
  box-shadow:0 8px 25px rgba(220,0,0,.25);
}

h1{
  margin:0;
  color:#c90000;
  font-size:32px;
  text-align:center;
}

.subtitle{
  text-align:center;
  font-size:22px;
  margin:10px 0 25px;
}

.amount{
  background:linear-gradient(135deg,#fff0f0,#fff);
  border:2px solid #ffc4c4;
  border-radius:25px;
  padding:20px;
  text-align:center;
  margin-bottom:25px;
}

.amount-title{
  font-size:21px;
  font-weight:bold;
}

.amount-value{
  font-size:58px;
  font-weight:900;
  color:#d00000;
  margin-top:5px;
}

label{
  display:block;
  font-size:21px;
  font-weight:bold;
  margin-bottom:10px;
}

input[type="text"]{
  width:100%;
  height:65px;
  border:2px solid #ddd;
  border-radius:18px;
  padding:0 20px;
  font-size:20px;
  outline:none;
  text-align:right;
  transition:.2s;
}

input[type="text"]:focus{
  border-color:#d80000;
  box-shadow:0 0 0 4px rgba(216,0,0,.08);
}

.upload{
  margin-top:20px;
  min-height:150px;
  border:2px dashed #bbb;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.2s;
  padding:20px;
}

.upload:hover{
  border-color:#d80000;
  background:#fff8f8;
}

.upload-icon{
  font-size:45px;
  color:#d00000;
}

.upload-title{
  font-size:21px;
  font-weight:bold;
  margin-top:8px;
}

.upload-sub{
  color:#999;
  margin-top:5px;
}

#fileInput{
  display:none;
}

.preview{
  display:none;
  margin-top:15px;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #ddd;
}

.preview img{
  width:100%;
  max-height:280px;
  object-fit:contain;
  display:block;
}

.note{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin:20px 0 10px;
}

.arrow{
  text-align:center;
  color:#e00000;
  font-size:35px;
  margin-bottom:8px;
}

button{
  width:100%;
  border:none;
  border-radius:20px;
  height:65px;
  font-size:23px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:active{
  transform:scale(.98);
}

.btn-pay{
  background:linear-gradient(135deg,#ff2222,#c90000);
  color:white;
  box-shadow:0 8px 20px rgba(200,0,0,.22);
}

.withdraw{
  margin-top:20px;
  background:linear-gradient(135deg,#333,#111);
  color:white;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}

/* نافذة الرسالة */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:25px;
  padding:30px 25px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:pop .2s ease;
}

@keyframes pop{
  from{
    transform:scale(.85);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.warning{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#fff0f0;
  color:#d00000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  margin:0 auto 15px;
}

.modal-box h2{
  margin:5px 0 10px;
  color:#c90000;
}

.modal-box p{
  font-size:19px;
  line-height:1.7;
  margin:0 0 20px;
}

.close{
  background:#111;
  color:white;
  height:55px;
  font-size:19px;
}

@media(max-width:500px){
  .logo-text{
    font-size:43px;
  }

  h1{
    font-size:27px;
  }

  .subtitle{
    font-size:19px;
  }

  .amount-value{
    font-size:48px;
  }

  .card{
    padding:25px 17px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <div class="logo-text">
      <span class="red">easy t</span><span class="black">.online</span>
    </div>
    <div class="logo-line"></div>
  </div>

  <div class="card">

    <div class="icon">▣</div>

    <h1>فاضل بس خطوة</h1>
    <div class="subtitle">دي آخر مرحلة للاستلام</div>

    <div class="amount">
      <div class="amount-title">المبلغ المطلوب:</div>
      <div class="amount-value">1420 ج</div>
    </div>

    <label>رقم الاستلام</label>

    <input
      type="text"
      id="receiveNumber"
      placeholder="اكتب رقم الاستلام"
    >

    <div class="upload" onclick="document.getElementById('fileInput').click()">

      <div class="upload-icon">☁️</div>

      <div class="upload-title">
        إرفاق صورة الإثبات
      </div>

      <div class="upload-sub">
        اختر صورة من المعرض
      </div>

    </div>

    <input
      type="file"
      id="fileInput"
      accept="image/*"
    >

    <div class="preview" id="previewBox">
      <img id="preview">
    </div>

    <div class="note">
      يرجى استكمال البيانات وإرفاق الصورة هنا
    </div>

    <div class="arrow">⌄</div>

    <button class="btn-pay" onclick="payButton()">
      💳 متابعة
    </button>

  </div>

  <button class="withdraw" onclick="withdrawButton()">
    🪙 سحب المكسب
  </button>

</div>


<!-- نافذة التنبيه -->

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="warning">!</div>

    <h2>لا يمكن المتابعة</h2>

    <p id="modalText">
      يرجى استكمال البيانات وإرفاق الصورة أولًا.
    </p>

    <button class="close" onclick="closeModal()">
      حسناً
    </button>

  </div>

</div>


<script>

const fileInput = document.getElementById("fileInput");
const previewBox = document.getElementById("previewBox");
const preview = document.getElementById("preview");

fileInput.addEventListener("change", function(){

  const file = this.files[0];

  if(file){

    const reader = new FileReader();

    reader.onload = function(e){

      preview.src = e.target.result;
      previewBox.style.display = "block";

    };

    reader.readAsDataURL(file);
  }

});


function showModal(message){

  document.getElementById("modalText").innerText = message;

  document.getElementById("modal").style.display = "flex";

}


function closeModal(){

  document.getElementById("modal").style.display = "none";

}


function payButton(){

  const number =
    document.getElementById("receiveNumber").value.trim();

  const file =
    document.getElementById("fileInput").files.length;

  if(!number){

    showModal("يرجى كتابة رقم الاستلام أولاً.");

    return;
  }

  if(!file){

    showModal("يرجى إرفاق صورة الإثبات أولاً.");

    return;
  }

  showModal("تم استكمال البيانات بنجاح.");

}


function withdrawButton(){

  const number =
    document.getElementById("receiveNumber").value.trim();

  const file =
    document.getElementById("fileInput").files.length;

  if(!number || !file){

    showModal(
      "لا يمكن المتابعة. يرجى استكمال البيانات وإرفاق الصورة أولًا."
    );

    return;
  }

  showModal(
    "تم استكمال بيانات الواجهة.  يتم تنفيذ تحويل أموال حقيقيه من هذه الصفحة."
  );

}

</script>

</body>
</html>
